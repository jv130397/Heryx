<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03090f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="RarePedigree Studio — construa e documente heredogramas clínicos com clareza científica." />
    <meta name="application-name" content="RarePedigree Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="RarePedigree Studio" />
    <meta property="og:description" content="Genética, família e descoberta em um editor científico de heredogramas." />
    <meta property="og:url" content="https://jv130397.github.io/RarePedigree-Studio/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://jv130397.github.io/RarePedigree-Studio/" />
    <link rel="icon" href="%BASE_URL%brand-mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <title>RarePedigree Studio — Heredogramas clínicos</title>
    <style>
      .boot-shell{position:fixed;inset:0;display:grid;place-items:center;padding:24px;color:#dffaff;background:#03090f;font-family:Arial,sans-serif}.boot-card{width:min(520px,100%);padding:28px;border:1px solid rgba(66,223,245,.28);border-radius:8px;background:#07151e;box-shadow:0 24px 80px rgba(0,0,0,.4)}.boot-card strong{display:block;color:#55dff4;font-size:12px;letter-spacing:.14em;text-transform:uppercase}.boot-card h1{margin:14px 0 10px;font-size:26px}.boot-card p{margin:0;color:#8faeb8;line-height:1.6}.boot-card button{margin-top:20px;padding:11px 16px;border:1px solid #55dff4;border-radius:4px;color:#031116;background:#55dff4;font-weight:700;cursor:pointer}.boot-detail{display:none;margin-top:14px!important;font-size:12px}.boot-shell.boot-failed .boot-detail{display:block}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-shell" id="boot-shell"><div class="boot-card"><strong>RarePedigree Studio</strong><h1>Iniciando observatório…</h1><p>Preparando o ambiente científico e os recursos gráficos.</p><p class="boot-detail" id="boot-detail">O navegador não conseguiu iniciar a interface. Recarregue a página ou desative temporariamente extensões que bloqueiam scripts.</p><button type="button" onclick="location.reload()">Recarregar página</button></div></div></div>
    <script>
      (function(){
        var failed=false;
        function showFailure(message){
          if(failed)return; failed=true;
          var shell=document.getElementById('boot-shell');
          var detail=document.getElementById('boot-detail');
          if(shell)shell.className+=' boot-failed';
          if(detail&&message)detail.textContent='Falha ao iniciar: '+message;
        }
        window.addEventListener('error',function(event){showFailure(event.message||'erro de carregamento');});
        window.addEventListener('unhandledrejection',function(){showFailure('um recurso necessário foi bloqueado');});
        window.setTimeout(function(){if(document.getElementById('boot-shell'))showFailure('a aplicação demorou mais que o esperado');},10000);
      }());
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
